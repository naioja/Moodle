---
dist: noble
os: linux
language: python
python: '3.14'

cache:
  directories:
    - .cache/uv
    - .cache/ci-python
    - .cache/pre-commit
    - .cache/arm-tools
    - $HOME/.npm

env:
  global:
    - PYTHONUNBUFFERED=1
    - PRE_COMMIT_HOME=$TRAVIS_BUILD_DIR/.cache/pre-commit
    - UV_CACHE_DIR=$TRAVIS_BUILD_DIR/.cache/uv
    - UV_PYTHON_INSTALL_DIR=$TRAVIS_BUILD_DIR/.cache/ci-python

install:
  - python -m pip install 'uv==0.13.5'
  - uv python install --no-bin 3.15.1
  - uv venv --python 3.15.1 .cache/ci-validation
  - uv pip install --python .cache/ci-validation/bin/python 'pre-commit==4.7.0'
  - nvm install 24.22.1
  - npm ci --ignore-scripts --no-fund --no-audit
  - bash etc/installArmTools.sh

script:
  - .cache/ci-validation/bin/python -W default etc/travis.py

